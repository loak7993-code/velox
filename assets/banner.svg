<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="velox — browser automation at terminal velocity">
  <title>velox</title>
  <defs>
    <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.5" stop-color="#0b1226"/>
      <stop offset="1" stop-color="#131a38"/>
    </linearGradient>
    <radialGradient id="b-glow" cx="0.26" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#4f46e5" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b-bolt" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.35" stop-color="#38bdf8"/>
      <stop offset="0.72" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="b-word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e8f6ff"/>
      <stop offset="1" stop-color="#a5d8ff"/>
    </linearGradient>
    <filter id="b-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="b-tight" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#b-bg)"/>
  <rect width="1280" height="640" fill="url(#b-glow)"/>

  <!-- ambient speed streaks -->
  <g fill="#38bdf8" opacity="0.07">
    <rect x="820" y="120" width="380" height="10" rx="5"/>
    <rect x="900" y="168" width="300" height="10" rx="5"/>
    <rect x="760" y="470" width="440" height="10" rx="5"/>
    <rect x="880" y="518" width="320" height="10" rx="5"/>
  </g>

  <!-- mark -->
  <g transform="translate(96,168)">
    <rect width="304" height="304" rx="70" fill="#080d1c"/>
    <rect width="304" height="304" rx="70" fill="url(#b-glow)"/>
    <rect x="1" y="1" width="302" height="302" rx="69" fill="none" stroke="#7dd3fc" stroke-opacity="0.16" stroke-width="2"/>
    <g transform="scale(0.59375) translate(6,0)">
      <g fill="#38bdf8">
        <rect x="92"  y="182" width="58" height="17" rx="8.5" opacity="0.30"/>
        <rect x="70"  y="240" width="104" height="17" rx="8.5" opacity="0.52"/>
        <rect x="92"  y="298" width="58" height="17" rx="8.5" opacity="0.30"/>
      </g>
      <g transform="translate(265,254) scale(1.16) translate(-265,-254)">
        <path d="M318 74 L186 292 h86 L198 438 L344 218 h-92 Z" fill="#22d3ee" opacity="0.45" filter="url(#b-soft)"/>
        <path d="M318 74 L186 292 h86 L198 438 L344 218 h-92 Z" fill="#38bdf8" opacity="0.55" filter="url(#b-tight)"/>
        <path d="M318 74 L186 292 h86 L198 438 L344 218 h-92 Z" fill="url(#b-bolt)"/>
        <path d="M318 74 L232 214 L262 214 L206 318 L246 244 L214 244 Z" fill="#e0f7ff" opacity="0.4"/>
      </g>
    </g>
  </g>

  <!-- wordmark -->
  <text x="470" y="316"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Helvetica, Arial, sans-serif"
        font-size="148" font-weight="700" letter-spacing="-5" fill="url(#b-word)">velox</text>

  <text x="474" y="374"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="500" fill="#8ea3c0">Browser automation at terminal velocity.</text>

  <!-- feature chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Helvetica, Arial, sans-serif"
     font-size="22" font-weight="600">
    <g>
      <rect x="474" y="410" width="216" height="46" rx="23" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="582" y="440" text-anchor="middle" fill="#7dd3fc">0 dependencies</text>
    </g>
    <g>
      <rect x="706" y="410" width="238" height="46" rx="23" fill="#818cf8" fill-opacity="0.10" stroke="#818cf8" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="825" y="440" text-anchor="middle" fill="#a5b4fc">any CDP browser</text>
    </g>
    <g>
      <rect x="960" y="410" width="228" height="46" rx="23" fill="#a855f7" fill-opacity="0.10" stroke="#a855f7" stroke-opacity="0.35" stroke-width="1.5"/>
      <text x="1074" y="440" text-anchor="middle" fill="#d8b4fe">or none at all</text>
    </g>
  </g>

  <!-- install line -->
  <text x="476" y="512"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace"
        font-size="23" fill="#5f7291">$ npm i github:loak7993-code/velox</text>
  <text x="476" y="548"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'DejaVu Sans', Helvetica, Arial, sans-serif"
        font-size="21" fill="#44536e">github.com/loak7993-code/velox</text>
</svg>
