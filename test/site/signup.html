<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Create your account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    label { display: block; margin-top: 10px; font-size: 13px; color: #333; }
    input, select { width: 100%; padding: 7px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 10px 18px; }
    #result { margin-top: 16px; padding: 12px; background: #f4f6f8; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 12px; }
  </style>
</head>
<body>
<h1>Create your account</h1>
<form id="signup" method="post" action="/api/signup">
  <label>Full name</label><input name="name" id="name">
  <label>Email</label><input name="email" id="email">
  <label>Phone</label><input name="phone" id="phone">
  <label>Address</label><input name="line1" id="line1">
  <label>City</label><input name="city" id="city">
  <label>Postal code</label><input name="postalCode" id="postalCode">
  <label>Country</label>
  <select name="country" id="country">
    <option value="US">United States</option>
    <option value="GB">United Kingdom</option>
    <option value="DE">Germany</option>
    <option value="FR">France</option>
    <option value="BR">Brazil</option>
    <option value="IN">India</option>
    <option value="JP">Japan</option>
    <option value="ES">Spain</option>
    <option value="NL">Netherlands</option>
    <option value="PL">Poland</option>
    <option value="ID">Indonesia</option>
  </select>
  <label>Date of birth</label><input name="dob" id="dob" type="date">
  <label>Password</label><input name="password" id="password" type="password">
  <label><input type="checkbox" name="tos" id="tos" style="width:auto"> I agree to the terms</label>
  <button type="submit" id="submit">Create account</button>
</form>
<div id="result">idle</div>

<script>
// ── a behaviour recorder, exactly like the ones behavioural-biometrics vendors ship ──
(function () {
  const rec = { keyIntervals: [], moveIntervals: [], downs: 0, ups: 0, lastKey: 0, lastMove: 0, focus: [], paste: 0, firstInputMs: null, loadAt: Date.now() };
  window.__vxBehaviour = rec;
  const now = () => performance.now();
  addEventListener('keydown', () => { const t = now(); if (rec.lastKey) rec.keyIntervals.push(t - rec.lastKey); rec.lastKey = t; if (rec.firstInputMs == null) rec.firstInputMs = t; });
  addEventListener('mousemove', () => { const t = now(); if (rec.lastMove) rec.moveIntervals.push(t - rec.lastMove); rec.lastMove = t; });
  addEventListener('mousedown', () => rec.downs++);
  addEventListener('mouseup', () => rec.ups++);
  addEventListener('paste', () => rec.paste++);
  addEventListener('blur', () => rec.focus.push('blur'));
  addEventListener('focus', () => rec.focus.push('focus'));

  // ── device payload: what a fingerprint SDK collects before signup ──
  window.__vxFingerprint = async function () {
    const canvasHash = () => {
      const c = document.createElement('canvas'); c.width = 200; c.height = 40;
      const x = c.getContext('2d'); x.textBaseline = 'top'; x.font = '14px Arial';
      x.fillStyle = '#f60'; x.fillRect(0, 0, 200, 40); x.fillStyle = '#069'; x.fillText('signup-fp', 2, 8);
      const s = c.toDataURL(); let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h;
    };
    let gl = null;
    try {
      const c = document.createElement('canvas').getContext('webgl');
      const e = c.getExtension('WEBGL_debug_renderer_info');
      gl = { vendor: c.getParameter(e.UNMASKED_VENDOR_WEBGL), renderer: c.getParameter(e.UNMASKED_RENDERER_WEBGL) };
    } catch (e) {}
    return {
      ua: navigator.userAgent, platform: navigator.platform, languages: navigator.languages,
      webdriver: navigator.webdriver === undefined ? null : navigator.webdriver,
      headless: /HeadlessChrome/.test(navigator.userAgent),
      plugins: navigator.plugins ? navigator.plugins.length : 0,
      chrome: !!window.chrome, hardwareConcurrency: navigator.hardwareConcurrency,
      screen: [screen.width, screen.height, screen.colorDepth], dpr: devicePixelRatio,
      timezone: Intl.DateTimeFormat().resolvedOptions().timeZone, gl,
      userAgentData: navigator.userAgentData ? navigator.userAgentData.platform : null,
      canvas: canvasHash(), touch: navigator.maxTouchPoints,
      storage: (() => { try { localStorage.setItem('vx_probe', '1'); const v = localStorage.getItem('vx_probe'); localStorage.removeItem('vx_probe'); return !!v; } catch (e) { return false; } })(),
    };
  };

  // ── submit: send the form + device payload + behaviour to the scorer ──
  document.getElementById('signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = Object.fromEntries(new FormData(e.target).entries());
    const payload = { form, device: await window.__vxFingerprint(), behaviour: rec };
    const r = await fetch('/api/signup', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    const out = await r.json();
    const el = document.getElementById('result');
    el.textContent = `status ${r.status}\nscore ${out.score}\nverification: ${out.verificationRequired}\nreasons:\n  - ` + (out.reasons || []).join('\n  - ');
    if (out.ok) {
      document.body.insertAdjacentHTML('beforeend', '<div id="welcome">Welcome aboard, ' + (form.name || '') + '!</div>');
    } else if (out.verificationRequired) {
      document.body.insertAdjacentHTML('beforeend', '<div id="verify">Verify your email to continue</div>');
    } else {
      document.body.insertAdjacentHTML('beforeend', '<div id="blocked">We could not create your account</div>');
    }
  });
})();
</script>
</body>
</html>
