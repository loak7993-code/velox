[package]
name = "velox-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
bytes = "1.12.1"
ego-tree = "0.11.0"
futures-util = "0.3.34"
libc = "0.2.190"
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "net", "fs"] }
tokio-tungstenite = "0.30.0"
url = "2.5.8"

[build-dependencies]
regex = "1.13.1"
